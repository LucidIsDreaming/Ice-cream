<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice Cream Order Form</title>
        <link rel="icon" href= "images/648872.png">
        <link rel="stylesheet" href="styles/styles.css">


</head>
<body>
    
    <div id="main">

        <div id="header">
            <h1>Ice Cream Order Form</h1> 
        </div>
    </div>
        <form id = "icecream-form" action = "#" method ="get">
            
                <h3>Personal Information</h3>


                    <!-- Name and Email -->
                
                    <fieldset>
                        <label for="fname">Name:</label>
                        <input type="text" id="fname" name="fname">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email">
                    </fieldset>
                
 
                <h3>Order Details</h3>

                <!-- Flavor -->
                <fieldset>
                        <legend>Choose your flavor:</legend>
                        <select id = "flavor" name = "flavor">
                            <option value = "none">-- Select a Flavor --</option>
                            <option value = "vanilla">Vanilla</option>
                            <option value = "chocolate">Chocolate</option>
                            <option value = "strawberry">Strawberry</option>
                        </select>
                </fieldset>

                <!-- Type of Cone -->
                <fieldset>
                    <legend>Choose your cone:</legend>
                    <label for ="waffle">
                        <input type = "radio" id = "waffle" name = "method" value = 
                        "waffle">
                        Waffle Cone
                    </label>
                    <label for ="sugar">
                        <input type = "radio" id = "sugar" name = "method" value = 
                        "sugar">
                        Sugar Cone
                    </label>
                    <label for ="cup">
                        <input type = "radio" id = "cup" name = "method" value = 
                        "cup">
                        Cup
                    </label>
                </fieldset>

                <!-- Toppings -->
                <fieldset>
                    <legend>Toppings:</legend>

                    <label for = "sprinkles">
                            <input type="checkbox" id="sprinkles"
                            name = "toppings[]" value ="sprinkles">
                            Sprinkles
                    </label>

                    <label for = "nuts">
                            <input type="checkbox" id="nuts"
                            name = "toppings[]" value ="nuts">
                            Nuts
                    </label>

                    <label for = "cherry">
                            <input type="checkbox" id="cherry"
                            name = "toppings[]" value ="cherry">
                            Cherry
                    </label>

                    <label for = "whipped-cream">
                            <input type="checkbox" id="whipped-cream"
                            name = "toppings[]" value ="whipped-cream">
                            Whipped Cream
                    </label>

                </fieldset>


                <!-- Comments -->
                
                <label for = "comment"> Additional Comments:</label>
                <textarea rows = "5" id="comment" name="comment"></textarea>

                <!-- Order Button -->
                <button type="submit" id="submit-button">Submit Order</button>

            </form>

        </div>
    </body>
</html>
